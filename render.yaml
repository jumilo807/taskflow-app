# Blueprint de Render: despliega TaskFlow como sitio estático.
# Render lo detecta automáticamente si eliges "New > Blueprint".
services:
  - type: web
    name: taskflow-app
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
